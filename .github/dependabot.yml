version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Only propose a change when the allowed range excludes a new release;
    # do not raise minimum versions that still work.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/", "/deploy"]
    schedule:
      interval: weekly
    ignore:
      # The image must run a Python version the test matrix covers (3.11, 3.13);
      # patch releases of 3.13 are still proposed.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
