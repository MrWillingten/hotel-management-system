[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel"
version = "0.9.0"
description = "Hotel Reservation and Management System: a secure, multilingual web application for reception staff and managers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.1,<4",
    "Flask-WTF>=1.2,<2",      # used only for CSRF protection
    "Flask-Babel>=4.0,<5",    # interface translations (en, fr, ar)
    "waitress>=3.0,<4",       # production WSGI server that runs on Windows and Linux
    "tzdata>=2024.1",         # time-zone database (Windows ships none)
    "segno>=1.6,<2",          # QR codes for two-factor enrolment (pure Python, no dependencies)
    "phonenumberslite>=9,<10",  # Google's phone-number rules, without geo/carrier data (1 MB)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

# Only for building the Windows executable (story 6.4); locked in requirements-build.lock.
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
hotel = "hotel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hotel = [
    "data/*.txt",
    "persistence/migrations/*.sql",
    "translations/*/LC_MESSAGES/*.po",
    "translations/*/LC_MESSAGES/*.mo",
    "web/templates/**/*.html",
    "web/static/**/*",
]

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:hotel.*",
    "error::ResourceWarning",                          # leaked files or database handles
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["hotel"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]

# ---------------------------------------------------------------- linting
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "DTZ", "PT"]
ignore = [
    "RUF001",  # ambiguous unicode characters: we deliberately use Arabic text
    "N818",    # BusinessRuleViolation reads better than BusinessRuleViolationError
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S311"]  # asserts, dummy passwords, test hosts
"src/hotel/web/{help,tour}.py" = ["E501"]  # whole translatable sentences read better unsplit
"prototype/scenarios.py" = ["S101", "DTZ001"]  # a checking script: asserts, hotel-local times

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
