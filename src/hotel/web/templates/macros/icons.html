{#- Inline SVG icons (24x24, stroke = currentColor), so no icon font or CDN is needed. -#}
{%- macro icon(name, label=None) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round"
     {%- if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true" focusable="false"{% endif %}>
  {%- if name == "sun" -%}
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  {%- elif name == "moon" -%}
    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
  {%- elif name == "monitor" -%}
    <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
  {%- elif name == "home" -%}
    <path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/>
  {%- elif name == "logout" -%}
    <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/>
  {%- elif name == "menu" -%}
    <path d="M4 7h16M4 12h16M4 17h16"/>
  {%- elif name == "globe" -%}
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
  {%- elif name == "key" -%}
    <circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>
  {%- elif name == "check" -%}
    <path d="M5 12.5l4.5 4.5L19 7.5"/>
  {%- elif name == "alert" -%}
    <path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/>
  {%- elif name == "info" -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>
  {%- elif name == "shield" -%}
    <path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>
  {%- elif name == "database" -%}
    <ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>
  {%- elif name == "calendar" -%}
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
  {%- elif name == "clock" -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == "flag" -%}
    <path d="M5 21V4M5 4h11l-2 4 2 4H5"/>
  {%- elif name == "bell" -%}
    <path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/>
  {%- endif -%}
</svg>
{%- endmacro %}
