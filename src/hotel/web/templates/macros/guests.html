{%- from "macros/icons.html" import icon -%}
{%- macro flags(guest) -%}
{%- if guest.is_vip %}<span class="badge badge--accent">{{ icon("star") }}{{ _("VIP") }}</span>{% endif %}
{%- if guest.do_not_rent %} <span class="badge badge--danger">{{ icon("ban") }}{{ _("Do not rent") }}</span>{% endif %}
{%- if guest.is_anonymised %} <span class="badge badge--neutral">{{ _("Anonymised") }}</span>{% endif %}
{%- endmacro %}
