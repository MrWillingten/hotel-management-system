<!doctype html>
<html lang="{{ locale }}" dir="{{ text_dir }}"{% if theme != "system" %} data-theme="{{ theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{ 'light dark' if theme == 'system' else theme }}">
  <title>{% block title %}{% endblock %} · {{ hotel_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">{{ _("Skip to content") }}</a>
  {%- if demo_mode %}
  <div class="demo-banner" role="note">{{ _("DEMO DATA: every guest, document and booking shown here is fictional.") }}</div>
  {%- endif %}
  {% block body %}{% endblock %}
</body>
</html>
