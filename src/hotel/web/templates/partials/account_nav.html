<nav class="subnav" aria-label="{{ _('My account') }}">
  {%- set links = [("account.change_password", _("Password")), ("account.two_factor", _("Two-factor sign-in"))] %}
  {%- if current_user.is_manager %}{% set links = links + [("account.api_tokens", _("API tokens"))] %}{% endif %}
  {%- for endpoint, label in links %}
  <a class="subnav__link" href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}>{{ label }}</a>
  {%- endfor %}
</nav>
